name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validateur et exemples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
          python -m pip install --upgrade pip pycairo pillow numpy

      - name: Frontmatter complet
        run: |
          for key in name version vasf app description; do
            grep -q "^$key:" SKILL.md || { echo "clé « $key » absente de SKILL.md"; exit 1; }
          done

      - name: L'exemple est importable
        run: python3 scripts/validate_vasf.py references/vasf-example.json

      - name: L'exemple se rend sans erreur
        run: |
          python3 scripts/preview_vasf.py references/vasf-example.json 0 1.5 3 6
          test -f tmp/vasf_preview/vasf-example/planche.png
